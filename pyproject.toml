[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamagate"
dynamic = ["version"]
description = "Secure pairing proxy that exposes a home Ollama server to your own devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoav" }]
keywords = ["ollama", "llm", "proxy", "gateway", "pairing", "mtls", "self-hosted", "tailscale"]
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<0.29",
    "textual>=0.80,<9",
    "qrcode>=7.4,<9",
    "cryptography>=42,<51",
    "typer>=0.12,<1",
    "maxminddb>=2.6,<4",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/111yoav111/OllamaGate"
Source = "https://github.com/111yoav111/OllamaGate"
Issues = "https://github.com/111yoav111/OllamaGate/issues"
Security = "https://github.com/111yoav111/OllamaGate/security/policy"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ollamagate = "ollamagate.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ollamagate.__version__" }

[tool.setuptools.packages.find]
include = ["ollamagate*"]

[tool.setuptools.package-data]
"ollamagate.web" = ["*.html", "*.js", "*.css"]
"ollamagate.tui" = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
