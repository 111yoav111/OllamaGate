[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamagate"
version = "0.1.0"
description = "Secure pairing proxy that exposes a home Ollama server to your own devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<0.29",
    "textual>=0.80,<9",
    "qrcode>=7.4,<9",
    "cryptography>=42,<51",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ollamagate = "ollamagate.__main__:main"

[tool.setuptools.packages.find]
include = ["ollamagate*"]

[tool.setuptools.package-data]
"ollamagate.web" = ["*.html", "*.js", "*.css"]
"ollamagate.tui" = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
