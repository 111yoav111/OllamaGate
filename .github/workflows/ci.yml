name: CI

# Kept cheap on purpose (Windows minutes count 2x, macOS 10x):
# - runs on pushes to main/dev and on pull requests, not on every branch push
# - skips docs-only changes (README.md and config.example.toml are still tested,
#   see tests/test_docs_in_sync.py; later patterns override earlier ones)
# - Linux only by default; Windows/macOS via "Run workflow" (full_matrix)
on:
  push:
    branches: [main, dev]
    paths: ["**", "!**.md", "README.md"]
  pull_request:
    paths: ["**", "!**.md", "README.md"]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Also test on Windows and macOS (uses many more minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.full_matrix && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q

  checks:
    # Packaging smoke test and dependency audit in one short job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip wheel --no-deps -w dist .
      - run: python -m pip install --no-deps dist/*.whl
      # The installed artifact must contain the web pages and TUI styles.
      - run: cd /tmp && ollamagate --help && python -c "from importlib import resources; assert resources.files('ollamagate.web').joinpath('app.html').is_file(); assert resources.files('ollamagate.tui').joinpath('gate.tcss').is_file()"
      - run: python -m pip install pip-audit && pip-audit --require-hashes -r requirements.lock
